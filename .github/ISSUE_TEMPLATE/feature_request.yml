name: Feature request
description: Suggest an improvement to PaperMode.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the learning or note-taking problem you want to solve. Search existing issues first and keep private information out of this public form.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe a concrete situation and who would benefit.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how you would use the feature. Mention any expected effect on locking or unlocking.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or current workaround
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Relevant macOS, browser or hardware requirements; redact personal information.
